name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========== 后端构建和测试 ==========
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smartclass-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B clean compile -DskipTests

      - name: Run Unit Tests
        run: mvn -B test
        env:
          MYSQL_PASSWORD: test
          REDIS_PASSWORD: test
          JWT_SECRET: test-secret-key-for-testing-min-32-chars
          DIFY_API_KEY: test
          DIFY_BASE_URL: http://localhost:8080/v1

      - name: Generate Test Report
        # dorny/test-reporter 的 path 相对仓库根解析；仅当确实产生了测试报告时执行
        if: always() && hashFiles('smartclass-backend/target/surefire-reports/TEST-*.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Maven Tests
          path: smartclass-backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

  # ========== 后端代码质量检查 ==========
  backend-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smartclass-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run SpotBugs
        run: mvn -B compile spotbugs:check

      - name: Run Checkstyle
        run: mvn -B checkstyle:check

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ========== 微服务模块构建 ==========
  microservice-build:
    name: Microservice Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smartclass-backend-microservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-ms-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-ms-

      - name: Build Microservices
        run: mvn -B clean compile -DskipTests

      - name: Run Microservice Tests
        run: mvn -B test
        env:
          MYSQL_PASSWORD: test
          REDIS_PASSWORD: test
          JWT_SECRET: test-secret-key-for-testing-min-32-chars

  # ========== 前端移动端构建 ==========
  frontend-mobile-build:
    name: Frontend Mobile Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smartclass-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smartclass-*-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test --if-present

      - name: Build Production
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: dist/
          retention-days: 7

  # ========== 前端管理后台构建 ==========
  frontend-admin-build:
    name: Frontend Admin Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smartclass-manage-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smartclass-*-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Type Check
        run: npm run tsc

      - name: Run Tests
        run: npm test --if-present

      - name: Build Production
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/
          retention-days: 7

  # ========== Monorepo 构建 (P1-4: pnpm + Turborepo) ==========
  monorepo-build:
    name: Monorepo Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smartclass-monorepo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo:build

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-ui-dist
          path: smartclass-monorepo/packages/ui/dist/
          retention-days: 7

  # ========== Docker 镜像构建 ==========
  docker-build:
    name: Docker Build & Push
    needs: [backend-build, microservice-build, frontend-mobile-build, frontend-admin-build, monorepo-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./smartclass-backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gateway
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./smartclass-backend-microservice
          file: ./smartclass-backend-microservice/Dockerfile
          build-args: |
            SERVICE_DIR=smartclass-backend-gateway
            SERVICE_PORT=8101
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Intelligence
        id: meta-intelligence
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/intelligence
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Intelligence
        uses: docker/build-push-action@v5
        with:
          context: ./smartclass-backend-microservice
          file: ./smartclass-backend-microservice/Dockerfile
          build-args: |
            SERVICE_DIR=smartclass-backend-intelligence
            SERVICE_PORT=10008
          push: true
          tags: ${{ steps.meta-intelligence.outputs.tags }}
          labels: ${{ steps.meta-intelligence.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Mobile Frontend
        id: meta-mobile
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mobile
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Mobile Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./smartclass-frontend
          push: true
          tags: ${{ steps.meta-mobile.outputs.tags }}
          labels: ${{ steps.meta-mobile.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Admin Frontend
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Admin Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./smartclass-manage-frontend
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 集成测试 ==========
  integration-test:
    name: Integration Test
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: smart_class
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: --health-cmd="curl -f http://localhost:9200/_cluster/health" --health-interval=30s --health-timeout=10s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for services
        run: |
          sleep 30
          curl -f http://localhost:9200/_cluster/health || exit 1

      - name: Run Integration Tests (Backend)
        run: mvn -B failsafe:integration-test failsafe:verify
        working-directory: ./smartclass-backend
        env:
          MYSQL_PASSWORD: test
          REDIS_PASSWORD: 
          JWT_SECRET: test-secret-key-for-testing-min-32-chars
          DIFY_API_KEY: test
          DIFY_BASE_URL: http://localhost:8080/v1

      - name: Run Integration Tests (Microservices)
        run: mvn -B failsafe:integration-test failsafe:verify
        working-directory: ./smartclass-backend-microservice
        env:
          MYSQL_PASSWORD: test
          REDIS_PASSWORD: 
          JWT_SECRET: test-secret-key-for-testing-min-32-chars

  # ========== 部署到 Staging ==========
  deploy-staging:
    name: Deploy to Staging
    needs: [integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # 这里可以添加实际的部署命令
          # 例如: kubectl apply -f k8s/staging/
          # 或: docker-compose -f docker-compose.staging.yml up -d
          echo "Staging deployment completed"

  # ========== 部署到生产 (需手动审批) ==========
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # 这里可以添加实际的部署命令
          # 例如: kubectl apply -f k8s/production/
          # 或: docker-compose -f docker-compose.prod.yml up -d
          echo "Production deployment completed"