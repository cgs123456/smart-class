syntax = "proto3";

package com.smartclass.smartclass.common;

option java_package = "com.smartclass.smartclass.common.proto";
option java_multiple_files = true;
option java_outer_classname = "CommonProtos";

message IdRequest {
    int64 id = 1;
}

message IdsRequest {
    repeated int64 ids = 1;
}

message BoolResponse {
    bool success = 1;
}

message Empty {
}

message LongResponse {
    int64 value = 1;
}

message StringResponse {
    string value = 1;
}